    // Update adjMatrix if there are connections between nodes
    for (let i = 0; i < data.length; i++) {
        for (let j = 0; j < data.length; j++) {
            if (sharesElement(data[i].daytimeRoutes.toString().split(' '), data[j].daytimeRoutes.toString().split(' '))){
                 adjMatrix[i][j] = 1;
            }
        }
    }

    function updateMap(adjRow, circleMatrix) {
        for (let n in adjRow){
          circleMatrix[n].setStyle({color: getColor(adjRow[n]), fillColor: getColor(adjRow[n])});
        }
    }



    function dijkstra(sourceNode) {
        // 1. Initialize lists (Replacing np.full)
        const helperBoolList = new Array(data.length).fill(false);
        const helperDistList = new Array(data.length).fill(Infinity);

        let currNode = sourceNode;
        helperDistList[currNode] = 0;

        for (let i = 0; i < data.length; i++) {
            helperBoolList[currNode] = true;
            
            // Get the current row of the adjacency matrix
            let adjacencyRow = adjMatrix[currNode];

            for (let j = 0; j < data.length; j++) {
                // Check if (distance to current + edge weight < known distance) AND edge exists
                if ((helperDistList[currNode] + adjacencyRow[j] < helperDistList[j]) && adjacencyRow[j] === 1) {
                    helperDistList[j] = helperDistList[currNode] + adjacencyRow[j];
                }
            }
            // Update the current node (Finding the next closest unvisited node)
            let minValue = Infinity;
            for (let k = 0; k < data.length; k++) {
                // play with adjacencyRow in place of helperDistList in the condition, below
                if (helperDistList[k] < minValue && helperBoolList[k] === false) {
                    minValue = helperDistList[k];
                    currNode = k;
                }
            }
        }
        return helperDistList;
    }
    

    function sharesElement(str1, str2) {
    // Loop through each character of the first string
    for (let char of str1) {
        // Check if the character exists in the second string
        if (str2.includes(char)) {
            return true;
        }
    }
    return false;
    }


    function getColor(distance){
    if (distance == 0)
        return '#0039A6';
    else if (distance == 1)
        return 'green';
    else if (distance == 2)
        return 'yellow';
    else if (distance == 3)
        return 'orange';
    //return '#0039A6';
    return 'red';
    }
